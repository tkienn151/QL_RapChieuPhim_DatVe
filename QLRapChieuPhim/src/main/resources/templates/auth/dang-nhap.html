<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Đăng nhập')}"></head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<main class="container py-5">
    <div class="auth-card card border-0 bg-white mx-auto">
        <div class="auth-card-header-bar"></div>
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-badge mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-person-lock"></i>
                </div>
                <h1 class="h4 fw-bold mb-1">Đăng nhập hệ thống</h1>
                <p class="text-muted small mb-0">Đăng nhập để đặt vé trực tuyến và quản lý lịch sử vé</p>
            </div>

            <form th:action="@{/dang-nhap}" method="post">
                <input type="hidden" name="quayLai" th:value="${quayLai}">
                <div class="mb-3">
                    <label for="tenDangNhap" class="form-label fw-semibold small">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                        <input type="text" class="form-control" id="tenDangNhap" name="tenDangNhap"
                               th:value="${tenDangNhap}" required maxlength="50" autofocus
                               autocomplete="username" spellcheck="false" autocorrect="off" autocapitalize="off"
                               enterkeyhint="next" placeholder="Nhập tên đăng nhập">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="matKhau" class="form-label fw-semibold small">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key text-secondary"></i></span>
                        <input type="password" class="form-control" id="matKhau" name="matKhau"
                               required autocomplete="current-password" enterkeyhint="done"
                               placeholder="Nhập mật khẩu">
                        <button class="btn btn-outline-secondary" type="button" data-hien-mat-khau="matKhau" aria-label="Hiện mật khẩu">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold rounded-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                </button>
            </form>

            <p class="text-center small mt-4 mb-0">
                Chưa có tài khoản? <a th:href="@{/dang-ky}" class="text-danger fw-semibold text-decoration-none">Đăng ký tài khoản mới</a>
            </p>

            <div class="mt-4 pt-3 border-top small text-muted bg-light rounded-3 p-3">
                <div class="fw-semibold text-dark mb-1"><i class="bi bi-info-circle text-danger me-1"></i>Tài khoản mẫu (mật khẩu: <code>123456</code>):</div>
                <div>&bull; Quản trị: <code>admin</code> &nbsp;|&nbsp; Nhân viên: <code>nhanvien1</code> &nbsp;|&nbsp; Khách: <code>khach01</code></div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
