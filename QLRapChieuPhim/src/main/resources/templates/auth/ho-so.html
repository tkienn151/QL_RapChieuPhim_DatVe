<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Hồ sơ cá nhân')}"></head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 section-title mb-1">Hồ sơ cá nhân</h1>
            <p class="text-muted small mb-0">Quản lý thông tin liên hệ và bảo mật tài khoản của bạn</p>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white py-3 fw-bold border-bottom d-flex align-items-center gap-2">
                    <i class="bi bi-person-vcard text-danger fs-5"></i>
                    <span>Thông tin tài khoản</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/ho-so/cap-nhat}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold text-muted">Tên đăng nhập</label>
                                <input type="text" class="form-control bg-light" th:value="${nd.tenDangNhap}" readonly>
                            </div>
                            <div class="col-md-6 mb-3" th:with="vt=${nd.vaiTro.name()}">
                                <label class="form-label small fw-semibold text-muted">Vai trò hệ thống</label>
                                <input type="text" class="form-control bg-light" readonly
                                       th:value="${vt == 'QUAN_TRI' ? 'Quản trị viên' : (vt == 'NHAN_VIEN' ? 'Nhân viên' : 'Khách hàng')}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="hoTen" class="form-label small fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="hoTen" name="hoTen" th:value="${hoTen}"
                                   required maxlength="100" autocomplete="name">
                            <div th:replace="~{fragments/loi-truong :: loiTruong('hoTen')}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label small fw-semibold">Email</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${email}"
                                       maxlength="100" autocomplete="email" spellcheck="false">
                                <div th:replace="~{fragments/loi-truong :: loiTruong('email')}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="soDienThoai" class="form-label small fw-semibold">Số điện thoại</label>
                                <input type="tel" class="form-control" id="soDienThoai" name="soDienThoai" th:value="${soDienThoai}"
                                       pattern="(0|\+84)[0-9]{9}" title="10 số, bắt đầu bằng 0 hoặc +84"
                                       maxlength="12" autocomplete="tel">
                                <div th:replace="~{fragments/loi-truong :: loiTruong('soDienThoai')}"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold rounded-3">
                            <i class="bi bi-floppy me-1"></i>Lưu thay đổi
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white py-3 fw-bold border-bottom d-flex align-items-center gap-2">
                    <i class="bi bi-shield-lock text-danger fs-5"></i>
                    <span>Đổi mật khẩu</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/ho-so/doi-mat-khau}" method="post">
                        <div class="mb-3">
                            <label for="matKhauCu" class="form-label small fw-semibold">Mật khẩu hiện tại</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="matKhauCu" name="matKhauCu"
                                       required autocomplete="current-password">
                                <button class="btn btn-outline-secondary" type="button" data-hien-mat-khau="matKhauCu" aria-label="Hiện mật khẩu">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div th:replace="~{fragments/loi-truong :: loiTruong('matKhauCu')}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="matKhauMoi" class="form-label small fw-semibold mb-0">Mật khẩu mới</label>
                            <div id="goiYMatKhauMoi" class="form-text mt-0 mb-1">Ít nhất 6 ký tự.</div>
                            <div class="input-group">
                                <input type="password" class="form-control" id="matKhauMoi" name="matKhauMoi"
                                       required minlength="6" maxlength="50" autocomplete="new-password"
                                       aria-describedby="goiYMatKhauMoi">
                                <button class="btn btn-outline-secondary" type="button" data-hien-mat-khau="matKhauMoi" aria-label="Hiện mật khẩu">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div th:replace="~{fragments/loi-truong :: loiTruong('matKhauMoi')}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="xacNhanMatKhauMoi" class="form-label small fw-semibold">Nhập lại mật khẩu mới</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="xacNhanMatKhauMoi" name="xacNhanMatKhauMoi"
                                       required minlength="6" maxlength="50" autocomplete="new-password"
                                       data-trung-voi="matKhauMoi">
                                <button class="btn btn-outline-secondary" type="button" data-hien-mat-khau="xacNhanMatKhauMoi" aria-label="Hiện mật khẩu">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div th:replace="~{fragments/loi-truong :: loiTruong('xacNhanMatKhauMoi')}"></div>
                        </div>
                        <button type="submit" class="btn btn-outline-danger px-4 fw-semibold rounded-3">
                            <i class="bi bi-key me-1"></i>Cập nhật mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
