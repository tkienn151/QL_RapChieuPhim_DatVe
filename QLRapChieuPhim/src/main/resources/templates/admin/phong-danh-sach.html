<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản lý phòng chiếu')}"></head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Quản lý phòng chiếu</h2>
        <a th:href="@{/admin/phong/them}" class="btn btn-primary btn-sm">+ Thêm phòng chiếu</a>
    </div>
    <form th:action="@{/admin/phong}" method="get" class="row g-2 mb-3">
        <div class="col-md-5"><input type="text" name="tuKhoa" class="form-control" placeholder="Tìm theo mã hoặc tên phòng..." th:value="${tuKhoa}"></div>
        <div class="col-md-3">
            <select name="sapXep" class="form-select">
                <option value="maPhong" th:selected="${sapXep == 'maPhong'}">Sắp xếp: Mã phòng</option>
                <option value="tenPhong" th:selected="${sapXep == 'tenPhong'}">Tên phòng</option>
                <option value="soHang" th:selected="${sapXep == 'soHang'}">Số hàng</option>
                <option value="soCot" th:selected="${sapXep == 'soCot'}">Số cột</option>
            </select>
        </div>
        <div class="col-md-2">
            <select name="tang" class="form-select">
                <option value="true" th:selected="${tang}">Tăng dần</option>
                <option value="false" th:selected="${!tang}">Giảm dần</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-1">
            <button type="submit" class="btn btn-dark flex-fill">Lọc</button>
            <a th:href="@{/admin/phong}" class="btn btn-outline-secondary">Xóa lọc</a>
        </div>
    </form>
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
            <tr><th>STT</th><th>Mã phòng</th><th>Tên phòng</th><th>Số hàng</th><th>Số cột</th><th>Tổng số ghế</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
            <tr th:each="phong, stt : ${dsPhong.content}">
                <td th:text="${dsPhong.number * dsPhong.size + stt.count}"></td>
                <td th:text="${phong.maPhong}"></td>
                <td th:text="${phong.tenPhong}"></td>
                <td th:text="${phong.soHang}"></td>
                <td th:text="${phong.soCot}"></td>
                <td th:text="${phong.tongSoGhe()}"></td>
                <td>
                    <a th:href="@{/admin/phong/sua/{id}(id=${phong.id})}" class="btn btn-sm btn-warning">Sửa</a>
                    <form th:action="@{/admin/phong/xoa/{id}(id=${phong.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn chắc chắn muốn xóa phòng này?')">
                        <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${dsPhong.empty}"><td colspan="7" class="text-center text-muted">Chưa có phòng chiếu.</td></tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/phantrang :: phanTrang(${dsPhong}, ${duongDan})}"></div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
