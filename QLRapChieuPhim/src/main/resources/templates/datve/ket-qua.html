<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Đặt vé thành công')}"></head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<main class="container py-5 text-center">
    <div class="card shadow-sm mx-auto border-0" style="max-width: 550px;">
        <div class="card-body py-5">
            <div class="display-1 text-success mb-3"><i class="bi bi-check-circle-fill"></i></div>
            <h2 class="mb-3 text-success">Giao Dịch Thành Công!</h2>
            <p class="mb-1">Cảm ơn bạn đã đặt vé. Mã tra cứu đơn hàng của bạn là:</p>
            <h3 class="fw-bold text-danger mb-4" th:text="${donDat.maDon}"></h3>

            <div class="text-start mx-auto mb-4" style="max-width: 380px;">
                <p class="small text-muted mb-2">Vé của bạn (<span th:text="${donDat.dsVe.size()}">1</span>):</p>
                <div class="d-flex justify-content-between border rounded px-3 py-2 mb-2" th:each="ve : ${donDat.dsVe}">
                    <span>Ghế <strong class="text-danger" th:text="${ve.ghe.nhanDang()}">A1</strong></span>
                    <span class="badge bg-dark user-select-all" th:text="${ve.maVe}">MAVE</span>
                </div>
            </div>

            <p class="text-muted small px-4 mb-4">Vui lòng xuất trình mã vé (hoặc mã đơn) cho nhân viên soát vé trước khi vào rạp.</p>

            <div class="d-flex justify-content-center flex-wrap gap-2">
                <button th:if="${donDat.trangThai != null and donDat.trangThai.name() == 'DA_THANH_TOAN'}"
                        type="button" class="btn btn-dark px-4" data-in-ve>
                    <i class="bi bi-printer me-1" aria-hidden="true"></i>In vé
                </button>
                <a th:href="@{/lich-su}" class="btn btn-outline-danger px-4">Vé Của Tôi</a>
                <a th:href="@{/}" class="btn btn-danger px-4">Về Trang Chủ</a>
            </div>
        </div>
    </div>
    <th:block th:replace="~{fragments/phieuve :: phieuVe(${donDat})}"></th:block>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
