<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Thông báo lỗi')}"></head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<main class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 text-center mx-auto p-4 p-md-5" style="max-width: 560px;">
        <div class="display-1 fw-bold text-danger mb-2" th:text="${maLoi != null} ? ${maLoi} : 'Lỗi'">404</div>
        <h1 class="h4 fw-bold mb-2" th:text="${tieuDe != null} ? ${tieuDe} : 'Đã có lỗi xảy ra'">Không tìm thấy trang</h1>
        <p class="text-muted mb-4" th:text="${thongBao != null} ? ${thongBao} : 'Vui lòng thử lại sau.'">Thông báo chi tiết.</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-danger rounded-pill px-4 fw-semibold" th:href="@{/}">
                <i class="bi bi-house-door me-1"></i>Về trang chủ
            </a>
            <a class="btn btn-outline-secondary rounded-pill px-4" href="javascript:history.back()">
                <i class="bi bi-arrow-left me-1"></i>Quay lại
            </a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
