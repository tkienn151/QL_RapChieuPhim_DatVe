<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>fragments/phim-card</title>
</head>
<body>

<div th:fragment="card(phim)" class="col" th:with="tt=${phim.trangThai.name()}">
    <div class="card phim-card h-100">
        <a th:href="@{/phim/chi-tiet(id=${phim.id})}" class="poster-wrap">
            <img class="poster"
                 th:src="${#strings.isEmpty(phim.poster)} ? @{/images/no-poster.svg(v=2)} : ((${#strings.startsWith(phim.poster, 'http')} or ${#strings.startsWith(phim.poster, '/')}) ? ${phim.poster} : @{/images/posters/{f}(f=${phim.poster},v=2)})"
                 th:alt="${phim.tenPhim}" loading="lazy" width="300" height="450">
            <span class="badge badge-trangthai"
                  th:classappend="${tt == 'DANG_CHIEU' ? 'bg-success' : (tt == 'SAP_CHIEU' ? 'bg-warning text-dark' : 'bg-secondary')}"
                  th:text="${tt == 'DANG_CHIEU' ? 'Đang chiếu' : (tt == 'SAP_CHIEU' ? 'Sắp chiếu' : 'Ngừng chiếu')}">Đang chiếu</span>
            <span class="badge-thoiluong">
                <i class="bi bi-clock me-1"></i><span th:text="|${phim.thoiLuong} phút|">120 phút</span>
            </span>
            <div class="poster-overlay">
                <span class="btn btn-danger btn-sm px-3 poster-cta">
                    <i class="bi bi-ticket-perforated me-1"></i><span th:text="${tt == 'DANG_CHIEU' ? 'Đặt vé ngay' : 'Xem chi tiết'}">Đặt vé ngay</span>
                </span>
            </div>
        </a>
        <div class="card-body p-3 d-flex flex-column">
            <div class="mb-1">
                <span class="badge bg-danger-subtle text-danger-emphasis rounded-pill fw-semibold"
                      th:text="${phim.theLoai.tenTheLoai}">Thể loại</span>
            </div>
            <h6 class="card-title mb-2 phim-ten">
                <a th:href="@{/phim/chi-tiet(id=${phim.id})}" class="stretched-link text-decoration-none" th:text="${phim.tenPhim}">Tên phim</a>
            </h6>
            <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center small text-muted">
                <span class="text-truncate" style="max-width: 60%;" th:title="${phim.daoDien}">
                    <i class="bi bi-person-video2 me-1"></i><span th:text="${phim.daoDien != null ? phim.daoDien : 'Đang cập nhật'}">Đạo diễn</span>
                </span>
                <span th:if="${phim.ngayKhoiChieu != null}">
                    <i class="bi bi-calendar3 me-1"></i><span th:text="${#temporals.format(phim.ngayKhoiChieu, 'dd/MM/yyyy')}">01/01/2026</span>
                </span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
